<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A5C">
<meta name="description" content="GiveOwl finds giveaways, sweepstakes, contests and online advent calendars. Save favorites and enter at the organizer.">
<title>GiveOwl – Giveaways, sweepstakes &amp; contests</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%231F2A5C'/%3E%3Ccircle cx='50' cy='56' r='32' fill='%23F7931E'/%3E%3Ccircle cx='38' cy='48' r='13' fill='%23FFF6E6'/%3E%3Ccircle cx='62' cy='48' r='13' fill='%23FFF6E6'/%3E%3Ccircle cx='38' cy='48' r='8' fill='%231F2A5C'/%3E%3Ccircle cx='62' cy='48' r='8' fill='%231F2A5C'/%3E%3C/svg%3E">
<style>
:root{
  --natt:#1F2A5C; --natt-2:#2B3A7A; --natt-3:#3A4B96;
  --oransje:#F7931E; --oransje-m:#E0701F; --korall:#FF5A5F; --gull:#FFD23F; --gull-lys:#FFF1C9;
  --krem:#FFF8EE; --papir:#FFFFFF; --blekk:#1A2140; --dempet:#5E6787; --linje:#ECE4D6; --ok:#1F9D6B;
  --radius:18px; --skygge:0 1px 0 rgba(0,0,0,.03),0 8px 22px -10px rgba(31,42,92,.35);
  --font: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --hode-a:#2B3A7A; --hode-b:#18214A; --primar:var(--natt); --primar-h:var(--natt-2); --aksent:var(--oransje);
}
/* Sesongtema: julekalender-fanen i november–desember */
body.advent{ --hode-a:#2a7a62; --hode-b:#0b2e24; --primar:#0f3b2e; --primar-h:#164c3c; --aksent:#c8372d; --krem:#fbf7ef; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--blekk);background:var(--krem);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.skjult{display:none!important}

header.topp{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 85% -10%,var(--hode-a) 0%,transparent 60%),linear-gradient(170deg,var(--hode-a) 0%,var(--hode-b) 100%);padding:calc(14px + env(safe-area-inset-top)) 18px 58px}
.prikker{position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90px 80px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 150px 20px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 210px 110px,#fff 50%,transparent 51%);background-size:240px 160px}
body.advent .prikker{opacity:.55;animation:sno 30s linear infinite}
@keyframes sno{to{background-position:0 160px}}
@media (prefers-reduced-motion:reduce){body.advent .prikker{animation:none}}
.topp-inner{position:relative;max-width:760px;margin:0 auto}
.topplinje{display:flex;align-items:center;justify-content:space-between;gap:10px}
.merke{display:flex;align-items:center;gap:10px;text-decoration:none}
.merke svg{flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.merke h1{font-weight:850;font-size:28px;letter-spacing:-.4px;margin:0;line-height:1}
.merke h1 b{color:var(--gull);font-weight:850}
.merke small{display:block;font-size:12.5px;font-weight:600;opacity:.75;letter-spacing:.2px;margin-top:3px}
.sprak{appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:750;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sprak:hover{background:rgba(255,255,255,.18)}
.ingress{margin:14px 0 0;font-size:15px;line-height:1.45;opacity:.88;max-width:520px}
.kant{position:absolute;left:0;right:0;bottom:-1px;height:26px;background:var(--krem);border-radius:26px 26px 0 0}
body.advent .kant{height:14px;border-radius:0;background:linear-gradient(45deg,var(--krem) 50%,transparent 52%) left bottom/20px 20px repeat-x,linear-gradient(-45deg,var(--krem) 50%,transparent 52%) left bottom/20px 20px repeat-x}

main{max-width:760px;margin:-40px auto 0;padding:0 14px calc(96px + env(safe-area-inset-bottom));position:relative}
.faner{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--papir);border-radius:16px;padding:5px;box-shadow:var(--skygge)}
.fane{appearance:none;border:0;background:transparent;border-radius:12px;padding:11px 8px;font-weight:750;font-size:15px;color:var(--dempet);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.fane .antall{font-size:12px;font-weight:800;background:var(--linje);color:var(--dempet);border-radius:99px;padding:1px 8px;min-width:22px}
.fane[aria-selected="true"]{background:var(--primar);color:#fff}
.fane[aria-selected="true"] .antall{background:rgba(255,255,255,.2);color:#fff}
.fane:focus-visible,.chip:focus-visible,.knapp:focus-visible,.stjerne:focus-visible,input:focus-visible,select:focus-visible,.sprak:focus-visible{outline:3px solid var(--gull);outline-offset:2px}

.verktoy{margin-top:14px;display:grid;gap:10px}
.sokrad{display:grid;grid-template-columns:1fr auto;gap:8px}
.sok{position:relative}
.sok svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dempet)}
.sok input{width:100%;border:1px solid var(--linje);background:var(--papir);border-radius:14px;padding:12px 12px 12px 40px;font-size:16px}
.land{position:relative}
.land select{appearance:none;border:1px solid var(--linje);background:var(--papir);border-radius:14px;padding:12px 30px 12px 12px;font-size:15px;font-weight:650;max-width:44vw;cursor:pointer}
.land::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--dempet);border-bottom:2px solid var(--dempet);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.rad{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--linje);background:var(--papir);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gull-lys);border-color:var(--gull);color:#6b4a0c}
.bryter{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--dempet);cursor:pointer;user-select:none;font-weight:600}
.bryter input{appearance:none;width:36px;height:22px;border-radius:99px;background:var(--linje);position:relative;cursor:pointer;margin:0;flex:none}
.bryter input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.bryter input:checked{background:var(--ok)}
.bryter input:checked::after{transform:translateX(14px)}

.luker{margin-top:16px;border-radius:var(--radius);padding:16px;color:#fff;background:linear-gradient(135deg,#c8372d 0%,#a92b22 100%);box-shadow:var(--skygge);position:relative;overflow:hidden}
.luker h2{margin:0 0 4px;font-size:20px}
.luker p{margin:0 0 10px;opacity:.9;font-size:14px}
.luker ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.luker li a{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;font-weight:700}
.luker .dato{position:absolute;right:14px;top:8px;font-size:46px;font-weight:850;opacity:.22;line-height:1}
.info{margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:var(--gull-lys);border:1px solid #f3dc97;color:#5e470f;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}

.liste{margin-top:16px;display:grid;gap:12px}
.kort{background:var(--papir);border-radius:var(--radius);box-shadow:var(--skygge);padding:16px;display:grid;gap:12px;border:1px solid rgba(236,228,214,.7);position:relative}
.kort.utlopt{opacity:.6}
.kort-topp{display:flex;gap:12px;align-items:flex-start}
.ikon{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#FFE9D2;color:var(--oransje-m)}
.kort[data-type="julekalender"] .ikon{background:#e5f0eb;color:#1f6150}
.tittelblokk{flex:1;min-width:0}
.arrangor{font-size:13px;font-weight:750;color:var(--dempet);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kort h3{margin:3px 0 0;font-size:17px;line-height:1.3;font-weight:800}
.stjerne{appearance:none;border:0;background:transparent;width:40px;height:40px;margin:-6px -6px 0 0;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:#c3bcae}
.stjerne[aria-pressed="true"]{color:var(--oransje)}
.stjerne:active{transform:scale(.9)}
.premie{display:flex;gap:10px;align-items:flex-start;background:var(--krem);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4;font-weight:600}
.premie svg{flex:none;margin-top:2px;color:var(--korall)}
.fakta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;line-height:1.4;margin:0}
.fakta dt{color:var(--dempet);font-weight:700}
.fakta dd{margin:0}
.merker{display:flex;gap:6px;flex-wrap:wrap}
.merkelapp{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;letter-spacing:.2px;border-radius:99px;padding:2px 8px;background:var(--linje);color:var(--dempet)}
.merkelapp.aktiv{background:#dff3ea;color:var(--ok)}
.merkelapp.kommer{background:#fdf1d8;color:#8a5d06}
.merkelapp.utlopt{background:#f6e2e1;color:#a92b22}
.merkelapp.snart{background:#ffe3e3;color:#c22a2f}
.merkelapp.kjop{background:#fff0e0;color:#a24d07}
.merkelapp.verden{background:#e7ebfb;color:var(--natt-2)}
.merkelapp.sponset{background:#efe9ff;color:#5b3fb6}
.kort-bunn{display:grid;gap:10px}
.knapp.delta{justify-content:center;width:100%}
.smaknapper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.smaknapper .sjekket{margin-left:auto;text-align:right}
.liten-knapp{appearance:none;border:1px solid var(--linje);background:var(--papir);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:750;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--blekk)}
.liten-knapp[aria-pressed="true"]{background:#dff3ea;border-color:#9fd8bd;color:#12704b}
.liten-knapp.ikonknapp{width:36px;height:36px;padding:0;justify-content:center}
.liten-knapp:focus-visible{outline:3px solid var(--gull);outline-offset:2px}
.kort.ferdig{border-color:#9fd8bd}
.kort.fokus{outline:3px solid var(--gull);outline-offset:2px}
.merkelapp.ny{background:var(--gull);color:#5a3d00}
.merkelapp.daglig{background:#e3f1fb;color:#1b5e8a}
.sortrad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.velg{position:relative;display:block}
.velg select{appearance:none;width:100%;border:1px solid var(--linje);background:var(--papir);border-radius:12px;padding:9px 28px 9px 12px;font-size:14px;font-weight:650;cursor:pointer;text-overflow:ellipsis}
.velg::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--dempet);border-bottom:2px solid var(--dempet);transform:translateY(-70%) rotate(45deg);pointer-events:none}
nav.bunn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--linje);display:grid;grid-template-columns:repeat(3,1fr);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav.bunn button{appearance:none;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:750;color:var(--dempet);padding:6px 0 4px;cursor:pointer;position:relative}
nav.bunn button svg{width:24px;height:24px}
nav.bunn button[aria-current="page"]{color:var(--primar)}
nav.bunn button[aria-current="page"] svg{color:var(--oransje)}
nav.bunn .prikk{position:absolute;top:2px;left:calc(50% + 6px);background:var(--korall);color:#fff;border-radius:99px;font-size:10.5px;line-height:16px;padding:0 5px;min-width:16px;text-align:center}
nav.bunn button:focus-visible{outline:3px solid var(--gull);outline-offset:-3px;border-radius:12px}
.fremdrift{background:var(--papir);border-radius:var(--radius);box-shadow:var(--skygge);padding:16px;display:grid;gap:8px}
.fremdrift h2{margin:0;font-size:15px;color:var(--dempet);font-weight:800}
.fremdrift .tall{font-size:26px;font-weight:850;line-height:1.1}
.fremdrift p{margin:0;color:var(--dempet);font-size:14px;line-height:1.45}
.bar{height:10px;border-radius:99px;background:var(--linje);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#35c48d);border-radius:99px}
.seksjon-tittel{margin:20px 4px 10px;font-size:12.5px;font-weight:850;letter-spacing:.5px;text-transform:uppercase;color:var(--dempet)}
.panel{background:var(--papir);border-radius:var(--radius);box-shadow:var(--skygge);padding:2px 16px}
.innst-rad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--linje)}
.innst-rad:last-child{border-bottom:0}
.innst-rad b{display:block;font-size:15px}
.innst-rad small{display:block;color:var(--dempet);font-size:13px;line-height:1.4;margin-top:2px}
.innst-rad input[type=time]{border:1px solid var(--linje);border-radius:10px;padding:8px;font-size:15px;background:var(--papir)}
.innst-rad .velg{min-width:150px}
.innst-rad a{font-weight:750}
.segment{display:inline-flex;background:var(--linje);border-radius:99px;padding:3px;flex:none}
.segment button{appearance:none;border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:750;cursor:pointer;color:var(--dempet)}
.segment button[aria-pressed="true"]{background:var(--papir);color:var(--blekk);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spor{margin-top:14px;background:var(--papir);border:1px solid #f3dc97;border-radius:14px;padding:14px;display:grid;gap:8px;box-shadow:var(--skygge)}
.spor strong{font-size:15px}
.spor p{margin:0;font-size:14px;line-height:1.45;color:var(--dempet)}
.spor .rad{gap:8px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--blekk);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.vis{opacity:1}

.liten{font-size:12px;color:var(--dempet)}
.knapp{appearance:none;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:8px;background:var(--primar);color:#fff;font-weight:800;font-size:15px;border-radius:12px;padding:11px 16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);cursor:pointer}
.knapp:hover{background:var(--primar-h)}
.knapp:active{transform:translateY(1px);box-shadow:none}
.knapp.lys{background:var(--papir);color:var(--primar);border:1px solid var(--linje);box-shadow:none}

.tom{text-align:center;padding:30px 18px 26px;color:var(--dempet);background:var(--papir);border-radius:var(--radius);border:1px dashed #dcd2bf;display:grid;gap:8px;justify-items:center}
.tom svg{margin-bottom:4px}
.tom strong{display:block;color:var(--blekk);font-size:17px}
.tom p{margin:0;max-width:360px;line-height:1.45}
.tom .rad{justify-content:center;margin-top:6px}

footer.merknad{margin-top:22px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--dempet);padding:14px;border-radius:14px;background:#f4ede0}
footer.merknad svg{flex:none;margin-top:2px}
footer.merknad a{font-weight:700;margin-right:8px}
@media (max-width:400px){.fane{font-size:14.5px;gap:6px;padding:10px 4px}.fane svg{display:none}.merke h1{font-size:25px}}
@media (min-width:640px){.liste{grid-template-columns:1fr 1fr}.merke h1{font-size:34px}}
</style>
</head>
<body>
<header class="topp">
  <div class="prikker" aria-hidden="true"></div>
  <div class="topp-inner">
    <div class="topplinje">
      <a class="merke" id="hjem" href="#">
        <svg width="46" height="46" viewBox="-420 -440 840 840" aria-hidden="true"><g >
  <!-- ear tufts -->

  <circle cx="120" cy="-110" r="150" fill="#FFF6E6"/>

  <circle cx="-92" cy="-140" r="30" fill="#fff"/>
  <circle cx="148" cy="-140" r="30" fill="#fff"/>
  <circle cx="-140" cy="-78" r="12" fill="#fff" opacity=".8"/>
  <circle cx="100" cy="-78" r="12" fill="#fff" opacity=".8"/>

  <g fill="#FFB020"><ellipse cx="-80" cy="378" rx="44" ry="22"/><ellipse cx="80" cy="378" rx="44" ry="22"/></g>
</g></svg>
        <div><h1>Give<b>Owl</b></h1><small data-t="tagline"></small></div>
      </a>
      <button class="sprak" id="sprak" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="sprakTekst">NO</span></button>
    </div>
    <p class="ingress" id="ingress"></p>
  </div>
  <div class="kant" aria-hidden="true"></div>
</header>

<main>
<div id="vUtforsk">
  <nav class="faner" role="tablist">
    <button class="fane" role="tab" data-type="konkurranse" aria-selected="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13M12 8S10.5 3 8 3.5 6.5 8 12 8zm0 0s1.5-5 4-4.5S17.5 8 12 8z"/></svg>
      <span data-t="fane_konk"></span> <span class="antall" id="antKonk">0</span></button>
    <button class="fane" role="tab" data-type="julekalender" aria-selected="false">

  function t(k,v){var s=(T[S.lang]&&T[S.lang][k]); if(s==null) s=T.en[k]; if(v) for(var x in v) s=String(s).split('{'+x+'}').join(v[x]); return s;}
  function landNavn(c){return (LANDNAVN[S.lang]||LANDNAVN.en)[c]||c;}
  function dager(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);}
  function datoTekst(s){
    var d=new Date(s+'T12:00'); var o={month:'short',day:'numeric'}; if(s.slice(0,4)!==IDAG.slice(0,4)) o.year='numeric';
    try{return new Intl.DateTimeFormat(S.lang==='nb'?'nb-NO':'en-US',o).format(d).replace(/\.$/,'');}catch(e){return s;}
  }
  function forrigeDag(s){var d=new Date(s+'T12:00'); d.setDate(d.getDate()-1); return iso(d);}

  function status(e){
    if(e.dod) return 'utløpt';
    var aar = e.aar || +(e.start||e.slutt||e.funnet||IDAG).slice(0,4);
    var start=e.start, slutt=e.slutt;
    if(!start && e.type==='julekalender'){start=aar+'-12-01'; if(!slutt) slutt=aar+'-12-31';}
    if(slutt && slutt<IDAG) return 'utløpt';
    if(start && start>IDAG) return 'kommer';
    return 'aktiv';
  }
  function merk(){ALLE.forEach(function(e){e._status=status(e);});}
  merk();
  function lukeÅpen(e){return e.type==='julekalender' && e._status==='aktiv' && IDAG.slice(5,7)==='12';}
  var adventSesong = /^(11|12)$/.test(IDAG.slice(5,7));

  // ---------- Mine deltakelser ----------
  function erDaglig(e){return e.frekvens==='daglig' || e.type==='julekalender';}
  function erDeltatt(e){var d=deltatt[e.id]; if(!d) return false; return erDaglig(e) ? d===IDAG : true;}
  function kanDeltaIdag(e){return e._status==='aktiv' && (e.type!=='julekalender' || lukeÅpen(e));}
  function erMin(e){return fav.has(e.id) || !!deltatt[e.id];}
  function dagensOppgave(e){return erMin(e) && kanDeltaIdag(e) && (erDaglig(e) || !deltatt[e.id] || deltatt[e.id]===IDAG);}
  function fremdrift(){var y=ALLE.filter(dagensOppgave), x=y.filter(function(e){return deltatt[e.id]===IDAG;}); return {x:x.length,y:y.length};}
  function veksleDeltatt(e){
    if(erDeltatt(e)) delete deltatt[e.id]; else deltatt[e.id]=IDAG;
    // rydd bort gamle daglige merker
    Object.keys(deltatt).forEach(function(id){var x=ALLE.find(function(o){return o.id===id;}); if(x && erDaglig(x) && deltatt[id]<IDAG && x._status==='utløpt') delete deltatt[id];});
    lagre('deltatt',deltatt); planlegg(); oppdater();
  }

  // Omtrentlige kurser – brukes BARE til å sortere premieverdi på tvers av valuta
  var KURS = {USD:1, EUR:1.08, GBP:1.27, NOK:0.092, SEK:0.094, DKK:0.145, CAD:0.73, AUD:0.66};
  function usd(e){return (typeof e.premieVerdi==='number' && e.premieVerdi>0) ? e.premieVerdi*(KURS[e.valuta]||1) : -1;}

  var $=function(id){return document.getElementById(id);};
  function iLand(e){return S.land==='ALLE' || e.land===S.land || e.land==='INT';}
  function synlig(e){return (S.visUtlopt || e._status!=='utløpt') && (!S.utenKjop || !e.kreverKjop);}
  function antallFor(type,land){return ALLE.filter(function(e){return e.type===type && (land==='ALLE'||e.land===land||e.land==='INT') && e._status!=='utløpt' && (!S.utenKjop||!e.kreverKjop);}).length;}

  function chip(el,verdi,tekst,aktiv,cb){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=tekst;b.setAttribute('aria-pressed',aktiv?'true':'false');b.onclick=function(){cb(verdi);};el.appendChild(b);}
  function fyllValg(sel,par,verdi){sel.innerHTML='';par.forEach(function(p){var o=document.createElement('option');o.value=p[0];o.textContent=p[1];sel.appendChild(o);});sel.value=verdi;}
  function landValg(sel){
    var par=[['ALLE','🌍 '+t('land_alle')]];
    LANDLISTE.slice().sort(function(a,b){ if(a==='US')return -1; if(b==='US')return 1; return landNavn(a).localeCompare(landNavn(b),S.lang);}).forEach(function(c){par.push([c,FLAGG[c]+' '+landNavn(c)]);});
    fyllValg(sel,par,S.land); sel.setAttribute('aria-label',t('innst_land'));
  }

  function toast(msg){var el=$('toast'); el.textContent=msg; el.classList.add('vis'); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('vis');},2200);}

  function tegnTekster(){
    document.documentElement.lang = S.lang==='nb'?'nb':'en';
    document.querySelectorAll('[data-t]').forEach(function(n){n.textContent=t(n.getAttribute('data-t'));});
    $('ingress').textContent = S.vis==='mine' ? t('ingress_mine') : S.vis==='innst' ? t('ingress_innst') : t('ingress');
    $('sok').placeholder=t('sok'); $('sok').setAttribute('aria-label',t('sok'));
    $('sprakTekst').textContent = S.lang==='nb' ? 'EN' : 'NO';
    $('sprak').setAttribute('aria-label', S.lang==='nb' ? 'Switch to English' : 'Bytt til norsk');
    landValg($('land'));
    fyllValg($('sortering'),[['frist',t('sort_frist')],['nyest',t('sort_nyest')],['verdi',t('sort_verdi')]],S.sort);
    $('sortering').setAttribute('aria-label',t('sort_aria'));
    var ik=t('innsats_kort'); fyllValg($('innsats'),[['alle',t('innsats_alle')],['rask',ik.rask],['middels',ik.middels],['lang',ik.lang]],S.innsats);
    $('innsats').setAttribute('aria-label',t('innsats_aria'));
    var lenker=[]; if(CFG.privacyUrl) lenker.push('<a href="'+CFG.privacyUrl+'" target="_blank" rel="noopener">'+t('personvern')+'</a>');
    if(CFG.submitUrl) lenker.push('<a href="'+CFG.submitUrl+'" target="_blank" rel="noopener">'+t('send_inn')+'</a>');
    $('lenker').innerHTML=lenker.join('');
    if(BYGGET) $('bygget').textContent=t('oppdatert',{d:datoTekst(BYGGET)});
  }

  function tegnKategorier(){
    var kat=[]; ALLE.forEach(function(e){if(e.type===S.type && iLand(e) && synlig(e) && kat.indexOf(e.kategori)<0) kat.push(e.kategori);});
    var navn=t('kat'); kat.sort(function(a,b){return (navn[a]||a).localeCompare(navn[b]||b,S.lang);});
    if(S.kategori!=='alle' && kat.indexOf(S.kategori)<0) S.kategori='alle';
    var el=$('kategori'); el.innerHTML='';
    if(kat.length<2){el.classList.add('skjult');return;} el.classList.remove('skjult');
    chip(el,'alle',t('kat_alle'),S.kategori==='alle',function(v){S.kategori=v;oppdater();});
    kat.forEach(function(k){chip(el,k,navn[k]||k,S.kategori===k,function(v){S.kategori=v;oppdater();});});
  }

  function treff(e){
    if(e.type!==S.type || !iLand(e) || !synlig(e)) return false;
    if(S.kategori!=='alle' && e.kategori!==S.kategori) return false;
    if(S.innsats!=='alle' && e.innsats!==S.innsats) return false;
    if(S.kunFav && !fav.has(e.id)) return false;
    var s=S.sok.trim().toLowerCase();
    if(s && (e.tittel+' '+e.arrangor+' '+e.premie+' '+(e.hvordanDelta||'')).toLowerCase().indexOf(s)<0) return false;
    return true;
  }

  function fristTekst(e){
    if(e.type==='julekalender'){
      if(e.start && e.slutt) return datoTekst(e.start)+' – '+datoTekst(e.slutt);
      if(e.start) return t('fra')+' '+datoTekst(e.start);
      return t('des_ukjent');
    }
    if(!e.slutt) return t('lopende');
    var d=dager(IDAG,e.slutt), s=datoTekst(e.slutt);
    if(d===0) return s+' ('+t('idag')+')'; if(d===1) return s+' ('+t('imorgen')+')';
    if(d>1 && d<=14) return s+' ('+t('dager_igjen',{n:d})+')';
    return s;
  }
  function merkelapp(e){
    if(e._status==='utløpt') return [t('st_utlopt'),'utlopt'];
    if(e._status==='kommer'){var s=e.start||((e.aar||IDAG.slice(0,4))+'-12-01'),d=dager(IDAG,s); return [d<=7?t('st_starter',{n:d}):t('st_kommer'),'kommer'];}
    if(e.type==='konkurranse' && e.slutt && dager(IDAG,e.slutt)<=3) return [t('st_snart'),'snart'];
    if(lukeÅpen(e)) return [t('st_luke'),'aktiv'];
    return [t('st_aktiv'),'aktiv'];
  }

  function delLenke(e){return (CFG.shareUrl||'https://giveowl.com/browse/')+'#'+encodeURIComponent(e.id);}
  function kopier(s){
    function reserve(){var ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('del_kopiert'));}catch(x){} ta.remove();}
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(function(){toast(t('del_kopiert'));},reserve); else reserve();
  }
  function del(e){
    var url=delLenke(e), tekst=e.tittel+(e.premie?' – '+e.premie:'');
    if(SHARE){SHARE.share({title:e.tittel,text:tekst,url:url,dialogTitle:t('del')}).catch(function(){});return;}
    if(navigator.share){navigator.share({title:e.tittel,text:tekst,url:url}).catch(function(){});return;}
    kopier(url);
  }

  function lagKort(e){
    var n=$('kortMal').content.firstElementChild.cloneNode(true);
    n.dataset.type=e.type; n.dataset.id=e.id; if(e._status==='utløpt') n.classList.add('utlopt');
    n.querySelector('.ikon').innerHTML=IKON[e.type];
    n.querySelector('.navn').textContent=(S.land==='ALLE'||e.land!==S.land ? (FLAGG[e.land]||'')+' ' : '')+e.arrangor;
    var m=merkelapp(e), ml=n.querySelector('.status'); ml.textContent=m[0]; ml.classList.add(m[1]);
    if(NYE.has(e.id) && e._status!=='utløpt'){var ny=document.createElement('span');ny.className='merkelapp ny';ny.textContent=t('ny');ml.after(ny);}
    n.querySelector('h3').textContent=e.tittel;
    n.querySelector('.premietekst').textContent=e.premie||'–';
    var dl=n.querySelector('.fakta'), rader=[[e.type==='julekalender'?t('periode'):t('frist'),fristTekst(e)],[t('slik'),e.hvordanDelta||'–']];
    if(e.innsats && t('innsats')[e.innsats]) rader.push([t('innsats_label'),t('innsats')[e.innsats]]);
    rader.push([t('kategori'),t('kat')[e.kategori]||e.kategori]);
    rader.forEach(function(p){var dt=document.createElement('dt');dt.textContent=p[0];var dd=document.createElement('dd');dd.textContent=p[1];dl.appendChild(dt);dl.appendChild(dd);});
    var mk=n.querySelector('.merker');
    function lapp(txt,cls){var s=document.createElement('span');s.className='merkelapp '+cls;s.textContent=txt;mk.appendChild(s);}
    if(e.frekvens==='daglig' && e.type==='konkurranse') lapp(t('daglig'),'daglig');
    if(e.kreverKjop) lapp(t('krever_kjop'),'kjop');
    if(e.land==='INT') lapp('🌍 '+t('verden'),'verden');
    if(e.sponset) lapp(t('sponset'),'sponset');
    if(!mk.children.length) mk.remove();
    n.querySelector('.sjekket').textContent = e.dod ? t('dod') : (e.sjekket ? t('sjekket',{d:datoTekst(e.sjekket)}) : '');
    var a=n.querySelector('.delta'); a.href=e.url; a.firstChild.textContent=t('delta'); a.setAttribute('aria-label',t('delta_aria',{o:e.arrangor}));
    if(e.sponset) a.rel='noopener noreferrer sponsored';
    var st=n.querySelector('.stjerne'), p=fav.has(e.id);
    st.setAttribute('aria-pressed',p?'true':'false'); st.setAttribute('aria-label',p?t('fav_fjern'):t('fav_legg'));
    st.onclick=function(){ var ny=!fav.has(e.id); if(ny) fav.add(e.id); else fav.delete(e.id); lagre('favoritter',Array.from(fav)); planlegg(); oppdater(); };
    var mb=n.querySelector('.merk'), gj=erDeltatt(e);
    if(kanDeltaIdag(e) || gj){
      mb.setAttribute('aria-pressed',gj?'true':'false');
      mb.lastChild.textContent = gj ? (erDaglig(e)?t('deltatt_idag'):t('deltatt')) : t('merk_deltatt');
      mb.onclick=function(){veksleDeltatt(e);};
      if(gj) n.classList.add('ferdig');
    } else mb.remove();
    var db=n.querySelector('.delknapp'); db.setAttribute('aria-label',t('del_aria',{t:e.tittel})); db.title=t('del'); db.onclick=function(){del(e);};
    return n;
  }

  function tegnLuker(){
    var boks=$('luker'), ul=$('lukeListe');
    var i=ALLE.filter(function(e){return fav.has(e.id) && lukeÅpen(e) && iLand(e);});
    if(IDAG.slice(5,7)!=='12' || !i.length || S.type!=='julekalender'){boks.classList.add('skjult');return;}
    boks.classList.remove('skjult'); $('lukeDato').textContent=+IDAG.slice(8,10); ul.innerHTML='';
    i.forEach(function(e){var li=document.createElement('li'),a=document.createElement('a');a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';
      a.innerHTML='<span></span><span aria-hidden="true">'+(erDeltatt(e)?'✓':'→')+'</span>';a.firstChild.textContent=e.arrangor+' – '+t('luke')+' '+(+IDAG.slice(8,10));li.appendChild(a);ul.appendChild(li);});
  }

  function ugleSvg(st){return '<svg width="'+st+'" height="'+st+'" viewBox="-420 -440 840 840" aria-hidden="true">'+UGLE+'</svg>';}
  function tomTilstand(){
    var t0=document.createElement('div'); t0.className='tom';
    var landHar = ALLE.some(function(e){return e.type===S.type && e.land===S.land && e._status!=='utløpt';});
    var tittel, tekst, knapper=[];
    if(S.kunFav){tittel=t('tom_fav_t');tekst=t('tom_fav');}
    else if(S.type==='julekalender' && (S.land==='ALLE'||landHar)){tittel=t('tom_jul_t');tekst=t('tom_jul');}
    else if(S.land!=='ALLE' && !landHar){tittel=t('tom_land_t',{land:landNavn(S.land)});tekst=S.type==='julekalender'?t('tom_jul'):t('tom_land');knapper.push(['alle',t('vis_alle_land')]);}
    else {tittel=t('tom_filter_t');tekst=t('tom_filter');}
    t0.innerHTML=ugleSvg(64)+'<strong></strong><p></p><div class="rad"></div>';
    t0.querySelector('strong').textContent=tittel; t0.querySelector('p').textContent=tekst;
    var r=t0.querySelector('.rad');
    knapper.forEach(function(k){var b=document.createElement('button');b.className='knapp lys';b.type='button';b.textContent=k[1];b.onclick=function(){S.land='ALLE';oppdater();};r.appendChild(b);});
    if(CFG.submitUrl && !S.kunFav){var a=document.createElement('a');a.className='knapp lys';a.href=CFG.submitUrl;a.target='_blank';a.rel='noopener';a.textContent=t('tips_oss');r.appendChild(a);}
    return t0;
  }

  var rang={aktiv:0,kommer:1,'utløpt':2};
  function sorter(a,b){
    var r=rang[a._status]-rang[b._status]; if(r) return r;
    if(S.sort==='nyest'){r=(NYE.has(b.id)?1:0)-(NYE.has(a.id)?1:0) || (b.funnet||'').localeCompare(a.funnet||''); if(r) return r;}
    if(S.sort==='verdi'){r=usd(b)-usd(a); if(r) return r;}
    return (a.land==='INT')-(b.land==='INT') || (b.sponset?1:0)-(a.sponset?1:0) || (a.slutt||a.start||'9999').localeCompare(b.slutt||b.start||'9999') || a.tittel.localeCompare(b.tittel);
  }

  function tegnUtforsk(){
    $('antKonk').textContent=antallFor('konkurranse',S.land); $('antJul').textContent=antallFor('julekalender',S.land);
    $('utenKjop').checked=S.utenKjop; $('kunFav').checked=S.kunFav; $('visUtlopt').checked=S.visUtlopt;
    document.querySelectorAll('.fane').forEach(function(f){f.setAttribute('aria-selected',f.dataset.type===S.type?'true':'false');});
    tegnKategorier(); tegnLuker();
    var info=$('adventInfo');
    if(S.type==='julekalender' && IDAG.slice(5,7)!=='12'){info.textContent=t('advent_info');info.classList.remove('skjult');} else info.classList.add('skjult');
    var liste=$('liste'); liste.innerHTML='';
    var r=ALLE.filter(treff).sort(sorter);
    var landHar = S.land==='ALLE' || ALLE.some(function(e){return e.type===S.type && e.land===S.land && e._status!=='utløpt';});
    if(!r.length || (!landHar && !S.kunFav)){liste.appendChild(tomTilstand());}
    r.forEach(function(e){liste.appendChild(lagKort(e));});
  }

  function tegnMine(){
    var f=fremdrift(), boks=$('fremdrift');
    var mine=ALLE.filter(erMin);
    var tekst = !mine.length ? t('fremdrift_tom') : t('fremdrift_hint');
    var stor = !mine.length ? t('fremdrift_ingen') : (f.y && f.x===f.y ? t('fremdrift_ferdig') : (f.y ? t('fremdrift',{x:f.x,y:f.y}) : t('fremdrift_ingen')));
    boks.innerHTML='<h2></h2><div class="tall"></div><div class="bar"><i></i></div><p></p>';
    boks.querySelector('h2').textContent=t('fremdrift_t')+' · '+datoTekst(IDAG);
    boks.querySelector('.tall').textContent=stor;
    boks.querySelector('.bar i').style.width=(f.y?Math.round(100*f.x/f.y):0)+'%';
    boks.querySelector('p').textContent=tekst;
    var ut=$('mineListe'); ut.innerHTML='';
    if(!mine.length){var tt=document.createElement('div');tt.className='tom';tt.style.marginTop='14px';tt.innerHTML=ugleSvg(72)+'<strong></strong><div class="rad"></div>';tt.querySelector('strong').textContent=t('tom_fav_t');
      var b=document.createElement('button');b.className='knapp';b.type='button';b.textContent=t('nav_utforsk');b.onclick=function(){byttVis('utforsk');};tt.querySelector('.rad').appendChild(b);ut.appendChild(tt);return;}
    var grupper=[
      ['sek_idag', function(e){return dagensOppgave(e) && deltatt[e.id]!==IDAG;}],
      ['sek_gjort', function(e){return deltatt[e.id]===IDAG;}],
      ['sek_tidligere', function(e){return !erDaglig(e) && deltatt[e.id] && deltatt[e.id]!==IDAG && e._status!=='utløpt';}],
      ['sek_senere', function(e){return !kanDeltaIdag(e) && e._status!=='utløpt' && !(deltatt[e.id]===IDAG);}],
      ['sek_utlopt', function(e){return e._status==='utløpt' && deltatt[e.id]!==IDAG;}]
    ];
    var brukt=new Set();
    grupper.forEach(function(g){
      var r=mine.filter(function(e){return !brukt.has(e.id) && g[1](e);}).sort(sorter); if(!r.length) return;
      var h=document.createElement('h2');h.className='seksjon-tittel';h.textContent=t(g[0])+' ('+r.length+')';ut.appendChild(h);
      var l=document.createElement('div');l.className='liste';l.style.marginTop='0';
      r.forEach(function(e){brukt.add(e.id);l.appendChild(lagKort(e));}); ut.appendChild(l);
    });
  }

  function rad(tittel,undertekst,hoyre){
    var d=document.createElement('div'); d.className='innst-rad';
    var v=document.createElement('div'); var b=document.createElement('b'); b.textContent=tittel; v.appendChild(b);
    if(undertekst){var s=document.createElement('small'); s.textContent=undertekst; v.appendChild(s);}
    d.appendChild(v); if(hoyre) d.appendChild(hoyre); return d;
  }
  function bryter(på,cb,av){var l=document.createElement('label');l.className='bryter';var i=document.createElement('input');i.type='checkbox';i.checked=på;i.disabled=!!av;i.onchange=function(){cb(i.checked);};l.appendChild(i);return l;}
  function seksjon(el,tittel){var h=document.createElement('h2');h.className='seksjon-tittel';h.textContent=tittel;el.appendChild(h);var p=document.createElement('div');p.className='panel';el.appendChild(p);return p;}

  function tegnInnst(){
    var el=$('vInnst'); el.innerHTML='';
    var p=seksjon(el,t('innst_varsler'));
    if(!LN){ p.appendChild(rad(t('v_web'),'')); }
    else {
      if(PERM!=='granted'){
        var kb=document.createElement('button'); kb.className='knapp'; kb.type='button'; kb.textContent=t('v_tillat'); kb.onclick=function(){spørOmTillatelse();};
        p.appendChild(rad(PERM==='denied'?t('v_av'):t('v_tillat_s'),'',PERM==='denied'?null:kb));
      }
      var av = PERM==='denied';
      p.appendChild(rad(t('v_frist'),t('v_frist_s'),bryter(V.frist,function(v){V.frist=v;endreVarsler();},av)));
      p.appendChild(rad(t('v_luker'),t('v_luker_s'),bryter(V.luker,function(v){V.luker=v;endreVarsler();},av)));
      var ti=document.createElement('input'); ti.type='time'; ti.value=V.tid; ti.disabled=av; ti.onchange=function(){if(/^\d\d:\d\d$/.test(ti.value)){V.tid=ti.value;endreVarsler();}};
      p.appendChild(rad(t('v_tid'),PERM==='granted'?t('v_tid_s')+' '+(PLANLAGT===1?t('v_planlagt1'):t('v_planlagt',{n:PLANLAGT})):t('v_tid_s'),ti));
    }
    p=seksjon(el,t('innst_generelt'));
    var seg=document.createElement('div'); seg.className='segment';
    [['en','English'],['nb','Norsk']].forEach(function(x){var b=document.createElement('button');b.type='button';b.textContent=x[1];b.setAttribute('aria-pressed',S.lang===x[0]?'true':'false');b.onclick=function(){settSprak(x[0]);};seg.appendChild(b);});
    p.appendChild(rad(t('innst_sprak'),'',seg));
    var lv=document.createElement('label'); lv.className='velg'; var ls=document.createElement('select'); lv.appendChild(ls); landValg(ls);
    ls.onchange=function(){S.land=ls.value;S.kategori='alle';oppdater();};
    p.appendChild(rad(t('innst_land'),t('innst_land_s'),lv));
    p=seksjon(el,t('innst_om'));
    p.appendChild(rad('GiveOwl'+(CFG.versjon?' '+CFG.versjon:''), BYGGET?t('oppdatert',{d:datoTekst(BYGGET)}):''));
    if(CFG.privacyUrl||CFG.submitUrl){var ln=document.createElement('div');ln.className='innst-rad';ln.innerHTML=$('lenker').innerHTML;ln.style.justifyContent='flex-start';p.appendChild(ln);}
    var nb=document.createElement('button'); nb.className='knapp lys'; nb.type='button'; nb.textContent=t('nullstill_knapp');
    nb.onclick=function(){ if(window.confirm(t('nullstill_ok'))){deltatt={};lagre('deltatt',deltatt);planlegg();oppdater();} };
    p.appendChild(rad(t('nullstill'),t('nullstill_s'),nb));
    var m=document.createElement('p'); m.className='liten'; m.style.margin='16px 4px'; m.style.lineHeight='1.5'; m.textContent=t('merknad'); el.appendChild(m);
  }

  // Myk forespørsel om varsler: vises i appen etter første favoritt, aldri ved oppstart
  function tegnSpor(){
    var el=$('spor'); var vis = LN && !V.spurt && fav.size>0 && (PERM==='prompt'||PERM==='prompt-with-rationale') && S.vis==='utforsk';
    if(!vis){el.classList.add('skjult');return;}
    el.classList.remove('skjult');
    el.innerHTML='<strong></strong><p></p><div class="rad"><button class="knapp" type="button" data-a="ja"></button><button class="knapp lys" type="button" data-a="nei"></button></div>';
    el.querySelector('strong').textContent=t('spor_t'); el.querySelector('p').textContent=t('spor');
    var ja=el.querySelector('[data-a=ja]'), nei=el.querySelector('[data-a=nei]'); ja.textContent=t('spor_ja'); nei.textContent=t('spor_nei');
    ja.onclick=function(){spørOmTillatelse();}; nei.onclick=function(){V.spurt=true;lagre('varsler',V);oppdater();};
  }

  function byttVis(v){S.vis=v; oppdater(); window.scrollTo(0,0);}
  function settSprak(l){S.lang=l;lagre('lang',S.lang);planlegg();oppdater();}

  function oppdater(){
    lagre('filter',{type:S.type,land:S.land,utenKjop:S.utenKjop,kunFav:S.kunFav,visUtlopt:S.visUtlopt,sort:S.sort,innsats:S.innsats});
    var advent = S.vis==='utforsk' && S.type==='julekalender' && adventSesong;
    document.body.classList.toggle('advent', advent);
    document.querySelector('meta[name="theme-color"]').content = advent ? '#0f3b2e' : '#1F2A5C';
    ['utforsk','mine','innst'].forEach(function(v){$( 'v'+v.charAt(0).toUpperCase()+v.slice(1) ).classList.toggle('skjult',S.vis!==v);});
    document.querySelectorAll('#bunn button').forEach(function(b){if(b.dataset.vis===S.vis) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');});
    tegnTekster();
    var f=fremdrift(), pr=$('minePrikk'), igjen=f.y-f.x; pr.textContent=igjen; pr.classList.toggle('skjult',!(igjen>0));
    if(S.vis==='utforsk') tegnUtforsk(); else if(S.vis==='mine') tegnMine(); else tegnInnst();
    tegnSpor();
  }

  // ---------- Lokale varsler (bare i Android-appen) ----------
  function hashId(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;} return 1000000+(Math.abs(h)%2000000000);}
  function sjekkTillatelse(){
    if(!LN) return Promise.resolve();
    return LN.checkPermissions().then(function(p){PERM=p.display;}).catch(function(){PERM='ukjent';});
  }
  function spørOmTillatelse(){
    if(!LN) return;
    LN.requestPermissions().then(function(p){PERM=p.display;}).catch(function(){})
      .then(function(){V.spurt=true;lagre('varsler',V);planlegg();oppdater();});
  }
  function endreVarsler(){lagre('varsler',V); if(PERM!=='granted' && (V.frist||V.luker)) spørOmTillatelse(); else {planlegg();oppdater();}}
  var planTimer=null;
  function planlegg(){ if(!LN) return; clearTimeout(planTimer); planTimer=setTimeout(planleggNå,400); }
  function planleggNå(){
    if(!LN || PERM!=='granted') return;
    var nå=Date.now(), tid=(V.tid||'09:00').split(':'), liste=[];
    function når(dato){var d=new Date(dato+'T00:00:00'); d.setHours(+tid[0]||9,+tid[1]||0,0,0); return d;}
    // Inexact on purpose: isExactNotification:false stops the plugin from opening the system
    // 'Alarms & reminders' (exact alarm) screen. Reminders don't need minute precision.
    var felles={channelId:'giveowl-reminders',smallIcon:'ic_stat_giveowl',iconColor:'#F7931E',isExactNotification:false,isExactMandatory:false};
    if(V.frist) ALLE.forEach(function(e){
      if(!fav.has(e.id) || e.type!=='konkurranse' || !e.slutt || e._status==='utløpt') return;
      if(!erDaglig(e) && deltatt[e.id]) return;
      var at=når(forrigeDag(e.slutt)); if(at.getTime()<=nå) return;
      liste.push(Object.assign({id:hashId(e.id),title:t('n_frist_t',{t:e.tittel}),body:t('n_frist',{o:e.arrangor,p:e.premie||''}),schedule:{at:at},extra:{id:e.id}},felles));
    });
    if(V.luker){
      var år=+IDAG.slice(0,4), kal=ALLE.filter(function(e){return fav.has(e.id) && e.type==='julekalender' && !e.dod;});
      for(var d=1; d<=24 && kal.length; d++){
        var ds=år+'-12-'+pad(d); if(ds<IDAG) continue;
        var åpne=kal.filter(function(e){var a=e.aar||år; if(a!==år) return false; var s=e.start||a+'-12-01', sl=e.slutt||a+'-12-24'; return s<=ds && ds<=sl;});
        if(!åpne.length) continue; var at=når(ds); if(at.getTime()<=nå) continue;
        liste.push(Object.assign({id:800000+d,title:t('n_luke_t',{d:d}),body:t('n_luke',{l:åpne.map(function(e){return e.arrangor;}).join(', ')}),schedule:{at:at},extra:{id:åpne.length===1?åpne[0].id:'',fane:'julekalender'}},felles));
      }
    }
    liste=liste.slice(0,64);
    // Never let scheduling crash the app: batch first, then one by one, then give up quietly.
    function enOgEn(){ return liste.reduce(function(p,n){ return p.then(function(ok){
        try{ return LN.schedule({notifications:[n]}).then(function(){return ok+1;},function(){return ok;}); }catch(e){ return ok; } }); }, Promise.resolve(0)); }
    function planAlle(){ if(!liste.length) return Promise.resolve(0);
      try{ return LN.schedule({notifications:liste}).then(function(){return liste.length;}, enOgEn); }catch(e){ return enOgEn(); } }
    try{
      Promise.resolve().then(function(){return LN.getPending();})
        .then(function(r){var ids=(r&&r.notifications||[]).map(function(n){return {id:n.id};}); return ids.length?LN.cancel({notifications:ids}):null;})
        .catch(function(){})
        .then(planAlle)
        .then(function(n){PLANLAGT=n||0; if(S.vis==='innst') oppdater();})
        .catch(function(){PLANLAGT=0;});
    }catch(e){ PLANLAGT=0; }
  }

  // ---------- Dyplenker: giveowl.com/browse/#<id> og trykk på varsel ----------
  function visOppforing(id){
    var e=ALLE.find(function(x){return x.id===id;}); if(!e) return false;
    S.vis='utforsk'; S.type=e.type; if(!iLand(e)) S.land='ALLE'; S.kategori='alle'; S.sok=''; $('sok').value=''; S.kunFav=false; S.innsats='alle';
    if(e._status==='utløpt') S.visUtlopt=true; if(e.kreverKjop) S.utenKjop=false;
    oppdater();
    var k=document.querySelector('.kort[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
    if(k){k.classList.add('fokus'); setTimeout(function(){k.scrollIntoView({block:'center',behavior:document.readyState==='complete'&&!forsteHent?'smooth':'auto'});},80);}
    return true;
  }
  function fraHash(){var h=decodeURIComponent((location.hash||'').slice(1)); if(h) visOppforing(h);}

  // ---------- Hendelser ----------
  document.querySelectorAll('.fane').forEach(function(f){f.onclick=function(){S.type=f.dataset.type;S.kategori='alle';oppdater();};});
  document.querySelectorAll('#bunn button').forEach(function(b){b.onclick=function(){byttVis(b.dataset.vis);};});
  $('sok').addEventListener('input',function(ev){S.sok=ev.target.value;oppdater();});
  $('land').onchange=function(ev){S.land=ev.target.value;S.kategori='alle';oppdater();};
  $('sortering').onchange=function(ev){S.sort=ev.target.value;oppdater();};
  $('innsats').onchange=function(ev){S.innsats=ev.target.value;oppdater();};
  $('utenKjop').onchange=function(ev){S.utenKjop=ev.target.checked;oppdater();};
  $('kunFav').onchange=function(ev){S.kunFav=ev.target.checked;oppdater();};
  $('visUtlopt').onchange=function(ev){S.visUtlopt=ev.target.checked;oppdater();};
  $('sprak').onclick=function(){settSprak(S.lang==='nb'?'en':'nb');};
  if(CFG.homeUrl) $('hjem').href=CFG.homeUrl; else $('hjem').onclick=function(ev){ev.preventDefault();window.scrollTo({top:0,behavior:'smooth'});};
  window.addEventListener('hashchange',fraHash);
  oppdater();
  fraHash();

  if(LN){
    try{ LN.createChannel({id:'giveowl-reminders',name:t('n_kanal'),importance:4,visibility:1}).catch(function(){}); }catch(e){}
    try{ LN.addListener('localNotificationActionPerformed',function(a){var x=(a&&a.notification&&a.notification.extra)||{}; if(x.id && visOppforing(x.id)) return; if(x.fane){S.vis='utforsk';S.type=x.fane;oppdater();}}); }catch(e){}
    sjekkTillatelse().then(function(){planlegg();oppdater();});
  }
  if(APP){ try{ APP.addListener('backButton',function(){ if(S.vis!=='utforsk') byttVis('utforsk'); else APP.exitApp(); }); }catch(e){} }

  // Hent nyeste oversikt fra nettet (tidsavbrudd). Feiler det, brukes lagret eller innebygd kopi.
  var forsteHent=true;
  function hentFraNett(){
    var url=CFG.dataUrl; if(!url || typeof fetch!=='function') return;
    var ctrl=typeof AbortController==='function'?new AbortController():null;
    var tm=setTimeout(function(){if(ctrl) ctrl.abort();}, CFG.timeoutMs||8000);
    fetch(url+(url.indexOf('?')<0?'?':'&')+'v='+Date.now(),{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
      .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
      .then(function(d){ if(!gyldig(d)) throw new Error('invalid'); if(String(d.bygget||'')<BYGGET) return;
        lagre('data',{bygget:d.bygget,oppforinger:d.oppforinger}); ALLE=d.oppforinger.slice(); BYGGET=d.bygget||BYGGET; merk(); beregnNye(); planlegg(); oppdater(); if(forsteHent && location.hash) fraHash(); })
      .catch(function(){}).then(function(){clearTimeout(tm); forsteHent=false;});
  }
  hentFraNett();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible') return;
    var nyDag=iso(new Date()); if(!q.get('dato') && nyDag!==IDAG){IDAG=nyDag; merk(); oppdater();}
    sjekkTillatelse().then(function(){ if(S.vis==='innst') oppdater(); });
    hentFraNett();
  });
})();
</script>
